on:
  pull_request:
  push:
    branches: [main, dev, web-mobile-pwa]

env:
  VITE_WEB_URL: https://app.folo.is
  VITE_API_URL: https://api.follow.is
  FOLO_E2E_API_URL: https://api.follow.is

name: ✨ CI Mobile Drawer E2E
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-e2e-mobile-drawer
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/web-mobile-pwa' }}

jobs:
  e2e-mobile-drawer:
    name: Playwright mobile drawer a11y
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Use Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --child-concurrency=1

      - name: Install Playwright Chromium
        run: pnpm --dir apps/desktop exec playwright install chromium --with-deps

      - name: Run mobile drawer a11y E2E
        run: pnpm --dir apps/desktop run e2e:web-mobile
