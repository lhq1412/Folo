on:
  pull_request:
  push:
    branches: [main, dev, web-mobile-pwa]

env:
  VITE_WEB_URL: https://app.folo.is
  VITE_API_URL: https://api.follow.is
  FOLO_E2E_API_URL: https://api.follow.is
  FOLO_E2E_USE_PROD_WEB_SERVER: "1"

name: ✨ CI Production PWA E2E
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-e2e-web-pwa
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/web-mobile-pwa' }}

jobs:
  e2e-web-pwa:
    name: Playwright production PWA regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Use Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --child-concurrency=1

      - name: Build web assets
        run: npm exec turbo run Folo#build:web

      - name: Install Playwright Chromium
        run: pnpm --dir apps/desktop exec playwright install chromium --with-deps

      - name: Run production PWA E2E
        run: pnpm --dir apps/desktop run e2e:web:pwa-prod

      - name: Run PWA coordinator E2E
        run: pnpm --dir apps/desktop run e2e:web:pwa

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-web-pwa
          path: apps/desktop/e2e/playwright-report/
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-web-pwa
          path: apps/desktop/e2e/test-results/
          retention-days: 14
