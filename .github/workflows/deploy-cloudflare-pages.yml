name: "☁️ Deploy Web to Cloudflare Pages"

on:
  push:
    branches: [web-mobile-pwa]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      VITE_FIREBASE_CONFIG: ${{ vars.VITE_FIREBASE_CONFIG }}
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://folo-api.1094712.xyz' }}
      VITE_WEB_URL: ${{ vars.VITE_WEB_URL || 'https://folo.1094712.xyz' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Cache turbo build setup
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - uses: pnpm/action-setup@v6

      - name: Use Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build desktop web (SPA)
        run: pnpm --filter Folo build:web:pages

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/desktop/out/web --project-name=folo-web-mobile
