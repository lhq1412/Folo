# Cloudflare Worker — API CORS proxy
# Deploy: wrangler deploy
name = "folo-api-proxy"
main = "../snippet.js"
compatibility_date = "2024-08-01"

[vars]
# Comma-separated extra browser origins allowed to call this proxy.
# Defaults already include production, staging, dev, and localhost:2233/2234.
# Example preview origin:
# FOLO_CORS_ALLOWED_ORIGINS = "https://folo.1094712.xyz"
